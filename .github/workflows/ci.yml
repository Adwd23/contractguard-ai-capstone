name: contractguard-ci

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: contractguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          pip check
      - name: Validate strict source-evaluation JSON
        run: |
          python scripts/grader_probe.py > EVALUATION.json
          cp EVALUATION.json evidence/grader_manifest.json
          python -m json.tool EVALUATION.json > /dev/null
          python -m json.tool evidence/grader_manifest.json > /dev/null
      - name: Compile and test
        run: |
          python -m compileall -q src scripts tests
          pytest
      - name: Reproduce all runtime rubric evidence
        run: |
          python scripts/run_capstone_demo.py
          python scripts/build_executed_notebook.py
          python scripts/runtime_grader_probe.py > evidence/runtime_grader_probe.json
          python -m json.tool evidence/runtime_grader_probe.json > /dev/null
      - name: Run pre-publication checks
        run: python scripts/prepublish_check.py --skip-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: contractguard-capstone-evidence
          path: |
            EVALUATION.json
            evidence/
            notebooks/ContractGuard_Capstone_Executed.ipynb
          if-no-files-found: error
          retention-days: 14
      - name: Refresh v1.3.1 executed evidence on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Adwd23"
          git config user.email "Adwd23@users.noreply.github.com"
          git add EVALUATION.json evidence notebooks/ContractGuard_Capstone_Executed.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "test: refresh v1.3.1 execution evidence [skip ci]"
            git push
          else
            echo "Execution evidence is already current."
          fi

  docker-minio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINIO_ROOT_USER: contractguard
      MINIO_ROOT_PASSWORD: contractguard-ci-password-2026
      CONTRACTGUARD_API_KEY: contractguard-ci-api-key
      MINIO_BUCKET: contractguard-reports
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install smoke-test client dependencies
        run: pip install -r requirements.txt
      - name: Start API and MinIO
        run: docker compose up -d --build minio contractguard
      - name: Verify S3 artifact persistence
        run: python scripts/docker_minio_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: contractguard-minio-smoke
          path: evidence/07_minio_docker_smoke.json
          if-no-files-found: error
          retention-days: 14
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans
