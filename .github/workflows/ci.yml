name: contractguard-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: pytest
      - run: python scripts/run_capstone_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: contractguard-capstone-evidence
          path: evidence/
