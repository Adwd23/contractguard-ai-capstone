services:
  contractguard:
    build: .
    init: true
    environment:
      CONTRACTGUARD_ROOT: /app
      CONTRACT_ALLOWED_ROOTS: /app/data
      CONTRACTGUARD_API_KEY: ${CONTRACTGUARD_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://github.com/SDAIAAcademy}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CHECKPOINT_DB: /app/evidence/checkpoints.sqlite
      LOG_FILE: /app/evidence/execution_log.jsonl
      METRICS_FILE: /app/evidence/metrics.prom
      ARTIFACT_DIR: /app/evidence/artifacts
      POLICY_DIR: /app/data/policies
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-contractguard}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-contractguard-change-me}
      MINIO_SECURE: "false"
      MINIO_BUCKET: contractguard-reports
    volumes:
      - contractguard_evidence:/app/evidence
    ports:
      - "8000:8000"
    depends_on:
      - minio
    command:
      - sh
      - -c
      - python scripts/wait_for_minio.py && exec uvicorn contractguard.api:app --host 0.0.0.0 --port 8000
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contractguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-contractguard-change-me}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      contractguard:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  contractguard_evidence:
  minio_data:
